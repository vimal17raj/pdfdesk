server {
    listen 80;
    server_name pdf.ho.elicobpo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # nginx 1.24 (Ubuntu 24.04) syntax
    server_name pdf.ho.elicobpo.com;

    # Use your company/internal CA cert here (or Let's Encrypt if the host is public).
    ssl_certificate     /etc/nginx/ssl/pdf.ho.elicobpo.com.crt;
    ssl_certificate_key /etc/nginx/ssl/pdf.ho.elicobpo.com.key;

    # Files of any size (tens of GB): no upload limit, and pass the upload straight through instead of
    # letting nginx save the whole thing to its own temp folder first. Limit it in PDFDESK_MAX_UPLOAD_MB if you want one.
    client_max_body_size   0;
    proxy_request_buffering off;
    proxy_buffering        off;       # downloads are streamed too
    client_body_timeout    3600s;
    proxy_read_timeout     3600s;     # big searches / OCR runs can take a long time
    proxy_send_timeout     3600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
