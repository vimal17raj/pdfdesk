services:
  pdfdesk:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # only nginx on the same host can reach it
    volumes:
      - ./data:/data
    environment:
      PDFDESK_JWT_SECRET: "put-a-long-random-string-here-at-least-32-chars"
      # Used ONCE, on the very first start, to create the 'admin' account.
      # Admin must choose a new password at first sign-in. Add other users in the app (Users button).
      PDFDESK_ADMIN_PASSWORD: "ChangeMe-First-Login-123"
      PDFDESK_OCR_LANGS: "eng"
      PDFDESK_MAX_UPLOAD_MB: "0"  # no total upload limit; browser PDFs are sent in small chunks
      # Performance for big files (500-900 pages). Match these to the server's CPU cores / RAM.
      PDFDESK_WORKERS: "3"        # web worker processes
      PDFDESK_OCR_JOBS: "2"       # CPU cores used by one OCR run (each needs ~300-500 MB RAM on big scans)
      PDFDESK_MAX_JOBS: "2"       # OCR/compress runs allowed at the same time on the server
      PDFDESK_HISTORY_MB: "1500"  # undo-history disk space per document
      # Optional AI summaries (document text is sent to Anthropic when set). Empty = offline summaries.
      ANTHROPIC_API_KEY: ""
